<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none">
  <title>Elliott Olson. Apps, tools and experiments I build for fun.</title>
  <defs>
    <pattern id="f-p" width="22" height="22" patternUnits="userSpaceOnUse" x="11.0" y="11.0">
      <circle cx="11.0" cy="11.0" r="1.5" fill="#000000"/>
    </pattern>
    <pattern id="f-pa" width="22" height="22" patternUnits="userSpaceOnUse" x="11.0" y="11.0">
      <circle cx="11.0" cy="11.0" r="1.8" fill="#0066CC"/>
    </pattern>
    <radialGradient id="f-fade" cx="790" cy="140" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(790 140) scale(480.0 304.0) translate(-790 -140)">
      <stop stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f-hot" cx="790" cy="140" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(790 140) scale(300 190) translate(-790 -140)">
      <stop stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f-glow" cx="790" cy="140" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(790 140) scale(330.0 209.00000000000003) translate(-790 -140)">
      <stop stop-color="#0066CC" stop-opacity=".10"/>
      <stop offset="1" stop-color="#0066CC" stop-opacity="0"/>
    </radialGradient>
    <mask id="f-mf"><rect width="1000" height="300" fill="url(#f-fade)"/></mask>
    <mask id="f-mh"><rect width="1000" height="300" fill="url(#f-hot)"/></mask>
    <clipPath id="bounds"><rect width="1000" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1000" height="300" fill="#FBFBFD"/>
    <rect width="1000" height="300" fill="url(#f-glow)"/>
    <rect width="1000" height="300" fill="url(#f-p)" mask="url(#f-mf)"/>
    <rect width="1000" height="300" fill="url(#f-pa)" mask="url(#f-mh)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="299" rx="23.5" stroke="#000000" stroke-opacity=".09"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="92" fill="#6E6E73" font-size="20" letter-spacing="-.1">Personal projects · Bellevue, Washington</text>
    <text x="52" y="178" fill="#1D1D1F" font-size="76" font-weight="600" letter-spacing="-3.2">Elliott Olson</text>
    <text x="56" y="228" fill="#6E6E73" font-size="26" letter-spacing="-.3">Apps, tools and experiments I build for fun.</text>
  </g>
</svg>
